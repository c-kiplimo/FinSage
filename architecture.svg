<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 730" width="640" height="730">
  <defs>
    <!-- Gives boxes + arrows the rough / hand-drawn wobble -->
    <filter id="r" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Arrowhead marker -->
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 2 L 11 6 L 0 10 L 2 6 Z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <!-- ─── canvas ─── -->
  <rect width="640" height="730" fill="white"/>

  <!-- tiny caption -->
  <text x="320" y="16" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="12" fill="#bbb">
    FinSage  —  how a message flows through the system
  </text>

  <!-- ══════════════════════════════════════════
       BOX DRAWING PATTERN:
         layer 1  white fill  (no filter — keeps interior clean)
         layer 2  stroke only with rough filter
       ══════════════════════════════════════════ -->

  <!-- ─── User Question ─── -->
  <rect x="200" y="28" width="240" height="50" fill="white"/>
  <rect x="200" y="28" width="240" height="50" rx="5"
        fill="none" stroke="#1a1a2e" stroke-width="2.5" filter="url(#r)"/>
  <text x="320" y="59" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="15" fill="#1a1a2e">
    User Question
  </text>

  <!-- arrow ↓ -->
  <path d="M 320,78 L 320,112"
        stroke="#1a1a2e" stroke-width="2" fill="none"
        marker-end="url(#ah)" filter="url(#r)"/>

  <!-- ─── Planner ─── -->
  <rect x="165" y="115" width="290" height="72" fill="white"/>
  <rect x="165" y="115" width="290" height="72" rx="5"
        fill="none" stroke="#1a1a2e" stroke-width="2.5" filter="url(#r)"/>
  <text x="320" y="141" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#1a1a2e">
    Planner
  </text>
  <text x="320" y="163" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="12" fill="#555">
    decides: retrieve or use history?
  </text>

  <!-- left fork arrow  (Planner → Retriever) -->
  <path d="M 228,187 L 152,252"
        stroke="#1a1a2e" stroke-width="2" fill="none"
        marker-end="url(#ah)" filter="url(#r)"/>
  <!-- fork label left -->
  <text x="74" y="216" font-family="'Comic Sans MS', cursive" font-size="11" fill="#888">finance</text>
  <text x="74" y="230" font-family="'Comic Sans MS', cursive" font-size="11" fill="#888">query</text>

  <!-- right fork arrow  (Planner → Chat History) -->
  <path d="M 412,187 L 480,252"
        stroke="#1a1a2e" stroke-width="2" fill="none"
        marker-end="url(#ah)" filter="url(#r)"/>
  <!-- fork label right -->
  <text x="488" y="216" font-family="'Comic Sans MS', cursive" font-size="11" fill="#888">casual /</text>
  <text x="488" y="230" font-family="'Comic Sans MS', cursive" font-size="11" fill="#888">follow-up</text>

  <!-- ─── Retriever ─── -->
  <rect x="40" y="255" width="220" height="84" fill="white"/>
  <rect x="40" y="255" width="220" height="84" rx="5"
        fill="none" stroke="#1a1a2e" stroke-width="2.5" filter="url(#r)"/>
  <text x="150" y="283" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="15" font-weight="bold" fill="#1a1a2e">
    Retriever
  </text>
  <text x="150" y="303" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="12" fill="#555">
    FAISS + Embeddings
  </text>
  <text x="150" y="322" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="11" fill="#888">
    top-5 docs by similarity
  </text>

  <!-- ─── Chat History  (dashed = lightweight path) ─── -->
  <rect x="384" y="255" width="212" height="84" fill="white"/>
  <rect x="384" y="255" width="212" height="84" rx="5"
        fill="none" stroke="#1a1a2e" stroke-width="2.5"
        stroke-dasharray="9,5" filter="url(#r)"/>
  <text x="490" y="283" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="15" font-weight="bold" fill="#1a1a2e">
    Chat History
  </text>
  <text x="490" y="303" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="12" fill="#555">
    no retrieval
  </text>
  <text x="490" y="322" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="11" fill="#888">
    faster and lighter
  </text>

  <!-- merge: Retriever → RAG Pipeline -->
  <path d="M 150,339 Q 150,428 268,432"
        stroke="#1a1a2e" stroke-width="2" fill="none"
        marker-end="url(#ah)" filter="url(#r)"/>

  <!-- merge: Chat History → RAG Pipeline -->
  <path d="M 490,339 Q 490,428 372,432"
        stroke="#1a1a2e" stroke-width="2" fill="none"
        marker-end="url(#ah)" filter="url(#r)"/>

  <!-- ─── RAG Pipeline ─── -->
  <rect x="158" y="435" width="324" height="66" fill="white"/>
  <rect x="158" y="435" width="324" height="66" rx="5"
        fill="none" stroke="#1a1a2e" stroke-width="2.5" filter="url(#r)"/>
  <text x="320" y="460" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="15" font-weight="bold" fill="#1a1a2e">
    RAG Pipeline
  </text>
  <text x="320" y="482" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="12" fill="#555">
    context + history + query  →  prompt
  </text>

  <!-- arrow ↓ -->
  <path d="M 320,501 L 320,537"
        stroke="#1a1a2e" stroke-width="2" fill="none"
        marker-end="url(#ah)" filter="url(#r)"/>

  <!-- ─── LLM ─── -->
  <rect x="175" y="540" width="290" height="64" fill="white"/>
  <rect x="175" y="540" width="290" height="64" rx="5"
        fill="none" stroke="#1a1a2e" stroke-width="2.5" filter="url(#r)"/>
  <text x="320" y="567" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="15" font-weight="bold" fill="#1a1a2e">
    LLM  —  GPT-4o
  </text>
  <text x="320" y="589" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="12" fill="#555">
    temperature 0.3  ·  max 512 tokens
  </text>

  <!-- arrow ↓ -->
  <path d="M 320,604 L 320,640"
        stroke="#1a1a2e" stroke-width="2" fill="none"
        marker-end="url(#ah)" filter="url(#r)"/>

  <!-- ─── Gradio Chat UI ─── -->
  <rect x="196" y="643" width="248" height="56" fill="white"/>
  <rect x="196" y="643" width="248" height="56" rx="5"
        fill="none" stroke="#1a1a2e" stroke-width="2.5" filter="url(#r)"/>
  <text x="320" y="668" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="15" font-weight="bold" fill="#1a1a2e">
    Gradio Chat UI
  </text>
  <text x="320" y="688" text-anchor="middle"
        font-family="'Comic Sans MS', cursive" font-size="12" fill="#555">
    localhost:7860
  </text>
</svg>
